<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Super Trunfo das Copas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a2456">
<meta name="apple-mobile-web-app-title" content="Super Trunfo">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--t1:#1753a8;--t2:#0a2456;--paper:#fff;--ink:#141d33;--muted:#5d6886;--gold:#ffc21a;--red:#e0233c;--green:#17a55a;--line:rgba(255,255,255,.16);--on:#fff;
 --st:#e0233c;--ouro:#d4a106;--prata:#8c99b0;--bronze:#b06a3b;--cw:112px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t1:#123f84;--t2:#061634;--paper:#f3f5fa}}
:root[data-theme="dark"]{--t1:#123f84;--t2:#061634;--paper:#f3f5fa}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--t2);color:var(--on);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:18px;line-height:1.3;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 120% 70% at 50% 0%,var(--t1),var(--t2) 70%),var(--t2)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.07;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 64px)}
html,body{height:100%}#app{min-height:100%}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.page{max-width:900px;margin:0 auto;padding:14px 14px 40px;min-height:100%;position:relative}
.page.center{display:flex;align-items:center;min-height:100%}
.page.center .next{width:100%}
.score .fs{position:static;width:34px;height:34px;font-size:18px;grid-row:1;grid-column:1;justify-self:start;color:var(--ink);background:transparent;border-color:#d9deea}
/* capa */
.hero{padding:34px 0 8px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:end}
.deck{position:relative;width:86px;height:118px}
.deck div{position:absolute;inset:0;border-radius:10px;border:4px solid var(--gold);background:repeating-linear-gradient(135deg,var(--red) 0 12px,#b3172d 12px 24px);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.deck div:nth-child(1){transform:rotate(-12deg) translateX(-8px)}.deck div:nth-child(2){transform:rotate(-3deg)}.deck div:nth-child(3){transform:rotate(8deg) translateX(8px);background:var(--paper)}
.hero h1{margin:0;font-size:34px;line-height:.9;font-weight:800;font-style:italic}
.hero h1 span{display:block;font-size:clamp(52px,14vw,92px);color:var(--gold);text-shadow:4px 4px 0 var(--red);letter-spacing:-1px}
.hero p{grid-column:1/-1;color:#d3ddf3;margin:6px 0 0;max-width:44ch}
.panel{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.panel h2{margin:4px 0 10px;font-size:21px;font-weight:700}
.rules summary{font-weight:700;font-size:21px}.rules p{color:#d3ddf3;margin:10px 0 0;max-width:70ch}
.forms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.form{border:2px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;padding:12px 0;font-size:20px}
.form.on{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:22px;font-weight:800;background:rgba(255,255,255,.14);margin-top:10px}
.btn.primary{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b88a00}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #b88a00}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.hint{color:#c6d2ec;font-size:17px;margin:8px 2px}
.bar{display:flex;gap:14px;align-items:baseline;padding:6px 92px 8px 2px;flex-wrap:wrap}
.bar b{font-size:28px;font-weight:800;margin-right:auto}.bar em{font-style:normal;color:var(--gold);font-weight:700}
.bar span{color:#aebbd9;font-weight:700}.bar .good{color:var(--gold)}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.counts span{font-size:14px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:#aebbd9}
.counts .good{background:rgba(23,165,90,.3);color:#b9f0d0}
/* pacote */
.packtile{margin:28px auto 8px;width:230px;height:320px;border-radius:18px;background:repeating-linear-gradient(135deg,var(--red) 0 22px,#b3172d 22px 44px);border:7px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 16px 40px rgba(0,0,0,.45);animation:bob 2.4s ease-in-out infinite;overflow:hidden;position:relative}
.pstripe{position:absolute;left:0;right:0;top:92px;height:46px;opacity:.95}
.packtile span{font-size:20px;font-weight:700;margin-bottom:62px}
.packtile b{font-size:34px;font-weight:800;font-style:italic;line-height:1;text-align:center;padding:0 10px;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.packtile small{font-size:16px;margin-top:6px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.fan{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;--cw:clamp(118px,30vw,150px)}
/* carta */
.card{position:relative;width:var(--cw);flex:none;display:flex;flex-direction:column;text-align:left;background:var(--paper);color:var(--ink);border:3px solid var(--c);border-radius:12px;padding:0 0 7px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.r-st{--c:var(--gold)}.r-ouro{--c:var(--ouro)}.r-prata{--c:var(--prata)}.r-bronze{--c:var(--bronze)}
.r-st{background:linear-gradient(170deg,#fff4c9,var(--paper) 50%);box-shadow:0 0 0 2px var(--red),0 4px 0 rgba(0,0,0,.28)}
.card .top{height:36px;position:relative;border-bottom:3px solid var(--c)}
.card .ov{position:absolute;left:6px;bottom:-14px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:800;font-size:19px;display:grid;place-items:center;border:2px solid var(--c)}
.card .ps{position:absolute;right:6px;top:5px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:800;padding:1px 6px;border-radius:5px}
.card .nm{font-weight:800;font-size:17px;line-height:1.05;padding:17px 7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sl{font-size:14px;color:var(--muted);padding:0 7px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chem{margin:0 6px 3px;font-size:12px;font-weight:800;color:#0d7a41;background:#dff5e8;border-radius:5px;padding:0 5px;align-self:flex-start}
.stats{padding:0 4px}
.stat{display:flex;justify-content:space-between;font-size:15px;padding:1px 4px;border-radius:5px}
.stat span{color:var(--muted)}.stat b{font-weight:800}
.stat.hl{background:var(--ink);color:#fff}.stat.hl span{color:#c9d3ea}
.stat.win{background:var(--green)}.stat.lose{background:#9aa3b8}
.rib{margin:6px 6px 0;text-align:center;font-size:12px;font-weight:800;font-style:italic;background:var(--red);color:var(--gold);border-radius:4px}
.mark{position:absolute;top:4px;left:6px;font-style:normal;font-size:20px;color:var(--gold);text-shadow:0 0 3px #000}
.mark.ok{left:auto;right:6px;top:30px;background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:15px;text-shadow:none}
.card.sel{box-shadow:0 0 0 3px var(--green),0 6px 0 rgba(0,0,0,.28);transform:translateY(-6px)}
.cback{background:repeating-linear-gradient(135deg,var(--red) 0 12px,#b3172d 12px 24px);border-color:var(--gold);align-items:center;justify-content:center;min-height:190px;color:#fff;font-weight:800;font-size:18px}
.cback.empty{background:rgba(255,255,255,.06);border:2px dashed var(--line);box-shadow:none;color:#aebbd9}
.cback.think span{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.enter{animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both}
.slotA .enter{animation-name:dealTop}
@keyframes deal{from{transform:translateY(60px) rotate(8deg) scale(.8);opacity:0}}
@keyframes dealTop{from{transform:translateY(-60px) rotate(-8deg) scale(.8);opacity:0}}
/* ferramentas */
.tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:20;display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(6,22,52,.7);font-size:20px;font-weight:800;line-height:1;backdrop-filter:blur(6px)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,10,26,.72);display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:var(--t2);border:1px solid var(--line);border-radius:18px;padding:12px 16px 16px;max-width:620px;width:100%;max-height:100%;overflow:auto}
.mbox .bar{padding-right:2px}
.steps{list-style:none;counter-reset:s;padding:0;margin:4px 0 8px}
.steps>li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-top:1px solid var(--line)}
.steps>li::before{content:counter(s);position:absolute;left:0;top:10px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;font-size:20px;display:grid;place-items:center}
.steps b{font-size:22px}.steps p{margin:4px 0 0;color:#d3ddf3;max-width:62ch}.steps u{text-decoration-color:var(--gold);text-decoration-thickness:2px}
.steps ul{margin:6px 0 0;padding-left:18px;color:#d3ddf3}.steps ul li{margin:2px 0}
/* campo */
.pitch{position:relative;width:100%;aspect-ratio:4/5;max-height:100%;margin:0 auto;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(180deg,#1f8a4c 0 10%,#1b7d44 10% 20%);border:3px solid rgba(255,255,255,.75);--sw:clamp(36px,min(10.5vmin,9.5dvh),82px)}
.pitch .lines{position:absolute;inset:0;pointer-events:none}
.pitch .lines::before{content:"";position:absolute;left:28%;right:28%;bottom:-3px;height:13%;border:3px solid rgba(255,255,255,.55);border-bottom:0}
.pitch .lines::after{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:50%;border-bottom:3px solid rgba(255,255,255,.35)}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.links line{stroke:#ffd84a;stroke-width:3;vector-effect:non-scaling-stroke;stroke-dasharray:5 4;opacity:.9}
.links line.strong{stroke:#7dffb0;stroke-width:4;stroke-dasharray:none}
.links line.dim{opacity:.45}
.slot{position:absolute;transform:translate(-50%,-50%);width:var(--sw);height:calc(var(--sw)*1.18);border-radius:10px;border:2px solid #fff;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 2px 4px;overflow:visible;box-shadow:0 3px 0 rgba(0,0,0,.3);z-index:2}
.slot.r-st{border-color:var(--gold);box-shadow:0 0 0 2px var(--red),0 3px 0 rgba(0,0,0,.3)}
.slot.empty{border:2px dashed rgba(255,255,255,.8);background:rgba(0,0,0,.2);color:#fff;box-shadow:none}
.slot.open{box-shadow:0 0 0 4px var(--gold)!important}
.slot.sel{box-shadow:0 0 0 4px var(--green)!important;transform:translate(-50%,-58%)}
.slot.used{opacity:.3;filter:grayscale(1)}
.slot .sflag{position:absolute;top:0;left:0;right:0;height:26%;border-radius:8px 8px 0 0}
.slot b{font-size:calc(var(--sw)*.36);font-weight:800;line-height:1}
.slot span{font-size:calc(var(--sw)*.2);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot small{position:absolute;top:1px;right:3px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 0 2px #000}
.slot .cb{position:absolute;top:-9px;right:-9px;font-style:normal;background:var(--green);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:1px 6px;border:2px solid #fff}
.float{position:absolute;left:50%;top:-8px;font-style:normal;font-weight:800;color:#7dffb0;font-size:22px;text-shadow:0 2px 0 #0b3d22;pointer-events:none;opacity:0;animation:floatUp 1.4s ease-out}
.float.inline{position:relative;left:auto;top:auto;margin-left:6px;font-size:18px;display:inline-block}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-34px)}}
.float.inline{animation-name:floatIn}@keyframes floatIn{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.bench{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;color:#c6d2ec}
.bench .slot{position:relative;transform:none;--sw:58px;flex:none}
.bench .btn{margin:0;flex:1}
/* escalação em tela dividida */
.split{min-height:100%;display:grid;grid-template-columns:1fr;gap:12px;padding:10px 12px 20px;max-width:1300px;margin:0 auto}
.split .bar{padding-right:90px}
.left{min-width:0}.right{min-width:0}
.shead{display:flex;gap:8px;align-items:center;margin:4px 0 8px}.shead b{font-size:24px;margin-right:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;--cw:100%}
.cand{display:flex;flex-direction:column;align-items:stretch}
.cand small{font-size:14px;font-weight:600;color:#aebbd9;margin-top:6px;line-height:1.25}.cand .up{color:#7ee2a8}
.combos{list-style:none;padding:0;margin:0}
.combos li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.combos li.none{display:block;color:#aebbd9}
.combos .sw{width:30px;height:20px;border-radius:4px;display:block}.combos .sw.st{background:var(--red);border:2px solid var(--gold)}
.combos b{display:block;font-size:19px}.combos span{color:#aebbd9;font-size:15px}
.combos em{font-style:normal;font-weight:800;font-size:22px;color:#7dffb0}
@media (orientation:landscape) and (min-width:600px){
 .split{grid-template-columns:minmax(0,44%) 1fr;height:100%;padding-bottom:10px}
 .split .left{display:flex;flex-direction:column;min-height:0;height:calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
 .split .left .pitch{flex:1;min-height:0;aspect-ratio:auto;width:100%}
 .split .bar{padding-right:2px}
 .split .right{height:calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding-top:44px}
}
/* tabela */
.next{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px;margin:10px 0 18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.next>p:first-child{margin:0;color:var(--muted);font-weight:700}
.next h2{margin:2px 0;font-size:34px;line-height:1.05;font-style:italic}
.next .sub{color:var(--muted);margin:8px 0 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-size:24px;font-weight:800;line-height:1.05}
.vs div:last-child{text-align:right}.vs em{font-size:30px;color:var(--red)}
.vs i{display:block;height:10px;border-radius:3px;margin-bottom:6px}
.final{font-size:22px;margin:8px 0}.final b{font-size:32px;margin:0 6px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gt{width:100%;border-collapse:collapse;background:rgba(0,0,0,.2);border-radius:12px;overflow:hidden;font-size:16px}
.gt caption{text-align:left;font-weight:800;padding:4px 2px}
.gt th{font-weight:600;color:#aebbd9;text-align:right;padding:3px 8px}
.gt td{padding:5px 8px;border-top:1px solid var(--line);text-align:right}
.gt td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.gt tr.q td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.gt tr.me{background:rgba(255,194,26,.2);font-weight:800}
.gt.mine{outline:2px solid var(--gold)}
h3{margin:18px 2px 6px;font-size:21px}
.res{list-style:none;padding:0;margin:0}
.res li{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 8px;border-top:1px solid var(--line)}
.next .res li{border-color:#dde3ee}
.res li span:last-child{text-align:right}.res b{white-space:nowrap}.res small{color:var(--red)}
/* partida: tela cheia, time à esquerda e cartas à direita */
.match{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"score" "arena" "pitch" ;max-width:1300px;margin:0 auto}
.mright{display:contents}
.mleft{grid-area:pitch;padding:6px 10px 0;min-height:0;display:flex}
.mleft .pitch{height:100%;aspect-ratio:auto;--sw:clamp(38px,min(6.4dvh,15vw),62px)}
.match .score{grid-area:score}.match .arena{grid-area:arena}.match .dock{grid-row:4}
.match{grid-template-rows:auto auto minmax(0,1fr) auto}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--paper);color:var(--ink);padding:6px 96px 8px 12px;border-radius:0 0 18px 18px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.score>span{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score>span:nth-of-type(2){text-align:right}
.score>b{font-size:38px;line-height:1;font-weight:800;font-style:italic}.score>b i{font-style:normal;color:var(--red);margin:0 6px;font-size:26px}
.match .tools .ib{background:rgba(255,255,255,.9);color:var(--ink);border-color:#d9deea;width:34px;height:34px}
.dots{grid-column:1/-1;display:flex;justify-content:center;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:#d6dbe7}.dots i.done{background:var(--ink)}.dots i.now{background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.arena{min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 12px 2px;--cw:clamp(108px,min(32vw,16dvh),200px)}
.catpill{background:var(--gold);color:var(--ink);font-weight:800;font-style:italic;font-size:21px;padding:2px 16px;border-radius:8px;box-shadow:0 3px 0 var(--red);transform:rotate(-3deg);margin-bottom:6px}
.catpill.off{background:rgba(255,255,255,.12);color:#aebbd9;box-shadow:none}
.duel{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.slotA,.slotB{display:flex;flex-direction:column;align-items:center;gap:3px}
.slotA small,.slotB small{font-weight:700;color:#c6d2ec;font-size:15px;max-width:var(--cw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duel .cback{min-height:calc(var(--cw)*1.4)}
.msg{min-height:44px;text-align:center;margin-top:6px;font-size:18px;max-width:520px}.msg b{color:var(--gold)}
.verdict{border-radius:14px;padding:6px 18px;display:inline-block}
.verdict b{display:block;font-size:30px;line-height:1.05;font-style:italic;color:#fff}.verdict span{font-weight:700}
.v-me{background:var(--green)}.v-bot{background:var(--red)}.v-tie{background:rgba(255,255,255,.18)}
.verdict.enter{animation:pop .4s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.flip.enter{animation:flip .5s ease-out both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
.dock{padding:6px 10px 8px}
.cats{display:flex;gap:6px;margin-bottom:6px}.chip.big{flex:1;padding:8px 0;font-size:19px}
.drow{display:flex;gap:8px;align-items:stretch}.drow .btn{margin:0;flex:1}
.toggle{flex:none;padding:2px 12px;border-radius:14px;border:2px dashed var(--gold);background:transparent;color:var(--gold);font-weight:800;font-size:17px;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.toggle small{font-size:13px;font-weight:600;opacity:.85}
.toggle.on{background:var(--gold);color:var(--ink);border-style:solid}
.cu{align-self:center;color:#8f9bbb;font-weight:700;font-size:15px}
.rinfo{margin:5px 2px 0;font-size:14px;color:#9fadcf;text-align:center}
@media (orientation:landscape) and (min-width:600px){
 .match{grid-template-columns:minmax(0,42%) 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"pitch score" "pitch arena" "pitch dock"}
 .match .dock{grid-row:auto;grid-area:dock}
 .mleft{padding:8px}
 .mleft .pitch{height:100%;max-height:none;--sw:clamp(40px,min(10.5dvh,8vw),84px)}
 .arena{--cw:clamp(104px,min(22vw,23dvh),210px)}
 .score{border-radius:0 0 18px 18px;margin:0 8px}
}
.pens{margin:10px 0}.pens div{display:flex;align-items:center;gap:5px;margin:4px 0}.pens span{width:120px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pens i{width:16px;height:16px;border-radius:50%}.pens i.g{background:var(--green)}.pens i.x{background:var(--red)}

/* modo */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode{text-align:left;border:2px solid var(--line);background:rgba(255,255,255,.06);border-radius:14px;padding:12px}
.mode b{display:block;font-size:22px;font-style:italic}.mode span{font-size:15px;color:#c6d2ec}
.mode.on{border-color:var(--gold);background:rgba(255,194,26,.16)}.mode.on b{color:var(--gold)}
/* simulação */
.clockrow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.clock{font-weight:800;font-size:20px;min-width:64px;color:var(--ink)}.clock small{font-size:12px;color:var(--muted)}
.clock.run{color:var(--green)}
.prog{flex:1;height:6px;border-radius:3px;background:#dde3ee;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.simarena{justify-content:flex-start;align-items:stretch;overflow:hidden;padding-top:10px}
.prebox{overflow-y:auto}.prebox h3{margin:6px 0}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 4px;border-top:1px solid var(--line);font-size:22px;font-weight:800}
.cmp em{font-style:normal;font-size:16px;color:#aebbd9;font-weight:600;min-width:80px;text-align:center}.cmp span:last-child{text-align:right}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:6px}.styles .chip{border-radius:10px;padding:8px 4px}
.up{color:#7ee2a8}.down{color:#ff8a98}
.stats2{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.sbar{display:grid;grid-template-columns:44px 1fr auto 1fr 44px;align-items:center;gap:6px;font-weight:800}
.sbar span:last-child{text-align:right}.sbar em{font-style:normal;font-size:14px;color:#aebbd9;font-weight:600;min-width:84px;text-align:center}
.sbar div{height:8px;border-radius:4px;background:rgba(255,255,255,.1);display:flex;justify-content:flex-end;overflow:hidden}
.sbar div.r{justify-content:flex-start}.sbar div i{background:var(--gold);transition:width .3s}.sbar div.r i{background:#ff8a98}
.feed{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0}
.feed li{display:flex;gap:10px;padding:6px 8px;border-top:1px solid var(--line);font-size:17px}.feed li.new{animation:deal .3s ease-out}
.feed em{font-style:normal;font-weight:800;color:#aebbd9;min-width:34px}
.feed .s-A{border-left:3px solid var(--gold)}.feed .s-B{border-left:3px solid #ff8a98}
.feed .e-gol{background:rgba(255,194,26,.14);font-size:19px}.feed .e-gol.s-B{background:rgba(224,35,60,.18)}
.feed .e-apito{color:#c6d2ec;font-style:italic}.feed .e-tec{color:#7ee2a8}
.feed small{color:#c6d2ec}
.feed.post{margin:10px 0;color:var(--ink)}.feed.post li{border-color:#dde3ee;animation:none}.feed.post em{color:var(--muted)}.feed.post small{color:var(--muted)}
.tact{margin-bottom:6px}.tact summary{font-weight:700;color:#c6d2ec;padding:2px}
.speed{display:flex;gap:4px;align-items:center}.speed .chip{padding:6px 10px}
.link{background:none;border:0;color:#aebbd9;text-decoration:underline;font-weight:600;padding:6px 2px;display:block;margin:2px auto 0}
.toggle:disabled{opacity:.6}
.slot .ball{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px;white-space:nowrap}
.goalfx{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;padding:14px 34px;border-radius:18px;text-align:center;pointer-events:none;opacity:0}
.goalfx b{display:block;font-size:56px;font-style:italic;line-height:1;color:#fff}.goalfx span{font-size:22px;font-weight:700}
.goalfx.enter{animation:goal 1.8s ease-out}
@keyframes goal{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.match.sim .mleft .pitch{--sw:clamp(38px,min(6.4dvh,15vw),62px)}
@media (orientation:portrait){.match.sim{grid-template-rows:auto minmax(0,1fr) minmax(0,.8fr) auto}.match.sim .mleft{grid-row:3}}
@media (max-height:520px){.feed li{font-size:15px;padding:3px 6px}.stats2{gap:2px}.goalfx b{font-size:40px}.link{display:none}
}
@media (max-height:520px){
 .duel .card .stat:not(.hl),.duel .card .chem,.duel .card .sl,.duel .card .rib{display:none}
 .duel .card .stat.hl{font-size:20px;margin-top:2px}.duel .cback{min-height:110px}
 .catpill{font-size:17px;margin-bottom:2px}.msg{font-size:15px;min-height:0;margin-top:4px}
 .verdict{padding:2px 14px}.verdict b{font-size:22px}.verdict span{font-size:14px}
 .score{padding-top:3px;padding-bottom:4px}.score>b{font-size:28px}.slotA small,.slotB small{font-size:13px}
 .cats .chip.big{padding:4px 0;font-size:16px}.drow .btn{padding:8px;font-size:18px}.rinfo{display:none}
}

function rar(c){ if(c.pos==="TEC") return c.ov>=88?"ouro":c.ov>=80?"prata":"bronze"; return c.ov>=90?"st":c.ov>=84?"ouro":c.ov>=76?"prata":"bronze"; }

function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rnd();}while(p>L);return k-1;}
function wpick(items,w){const t=items.reduce((s,x)=>s+w(x),0);let r=rnd()*t;for(const x of items){r-=w(x);if(r<=0)return x;}return items[items.length-1];}

// ===== Química =====
function chemistry(ids,coach){
  const cs=ids.filter(Boolean).map(id=>C[id]), out={};
  cs.forEach(c=>{
    let b=0; const parts=[]; const same=cs.filter(o=>o!==c&&o.sel===c.sel);
    const n=Math.min(same.length,3); if(n){b+=n;parts.push(["Mesma seleção",n]);}
    if(same.some(o=>LINE[o.pos]===LINE[c.pos])){b++;parts.push(["Mesmo setor",1]);}
    if(same.some(o=>o.copa===c.copa)){b++;parts.push(["Mesma Copa",1]);}
    if(isST(c)){const k=Math.min(cs.filter(o=>o!==c&&isST(o)).length,2); if(k){b+=k;parts.push(["Dupla Super Trunfo",k]);}}
    if(coach&&C[coach].sel===c.sel){b++;parts.push(["Técnico da seleção",1]);}
    out[c.id]={b,parts};
  });
  return out;
}
const chemTotal=ch=>Object.values(ch).reduce((s,x)=>s+x.b,0);

// ===== Pacotes: cada pacote destaca uma seleção =====
function genPacks(copas,form){
  const pool=Object.values(C).filter(c=>c.pos!=="TEC"&&copas.includes(c.copa));
  const used=new Set();
  const free=f=>pool.filter(c=>!used.has(c.id)&&f(c));
  const roll=()=>{ const x=rnd(); const r=x<0.02?"st":x<0.1?"ouro":x<0.42?"prata":"bronze"; let c=free(c=>rar(c)===r); if(!c.length) c=free(()=>true); return c[Math.floor(rnd()*c.length)]; };
  const coaches=Object.values(C).filter(c=>c.pos==="TEC"&&copas.includes(c.copa));
  const cnt={}; pool.forEach(c=>cnt[c.sel]=(cnt[c.sel]||0)+1);
  const sels=Object.keys(cnt), feat=[], packs=[];
  for(let i=0;i<10;i++){
    const f=(feat.length&&rnd()<0.35)?feat[Math.floor(rnd()*feat.length)]:wpick(sels,s=>cnt[s]);
    feat.push(f); const pk=[];
    for(let k=0;k<2;k++){ const c=free(c=>c.sel===f); const x=c.length?c[Math.floor(rnd()*c.length)]:roll(); used.add(x.id); pk.push(x.id); }
    for(let k=0;k<3;k++){
      if(k===2&&rnd()<0.4){ const fc=coaches.filter(c=>!used.has(c.id)&&c.sel===f); const ac=coaches.filter(c=>!used.has(c.id)); const x=(fc.length&&rnd()<0.6)?fc[Math.floor(rnd()*fc.length)]:ac[Math.floor(rnd()*ac.length)]; used.add(x.id); pk.push(x.id); continue; }
      const x=roll(); used.add(x.id); pk.push(x.id);
    }
    packs.push({sel:f,ids:pk});
  }
  // garante cartas suficientes para a formação (vaga + 1 de reserva) e ao menos 1 técnico
  const need=FORMATIONS[form];
  const have=()=>{const h={};packs.forEach(p=>p.ids.forEach(id=>{const q=C[id].pos;h[q]=(h[q]||0)+1;}));return h;};
  Object.keys(need).forEach(pos=>{
    let h=have(), guard=0;
    while((h[pos]||0)<need[pos]+1&&guard++<20){
      const surplus=Object.keys(need).filter(q=>q!==pos&&(h[q]||0)>need[q]+2);
      const spots=[]; packs.forEach((p,pi)=>p.ids.forEach((id,ii)=>{ if(ii>=2&&surplus.includes(C[id].pos)) spots.push([pi,ii]); }));
      if(!spots.length) break;
      const [pi,ii]=spots[Math.floor(rnd()*spots.length)];
      const opts=free(c=>c.pos===pos&&rar(c)!=="st"); const x=opts[Math.floor(rnd()*opts.length)];
      used.add(x.id); packs[pi].ids[ii]=x.id; h=have();
    }
  });
  if(!packs.some(p=>p.ids.some(id=>C[id].pos==="TEC"))){ const ac=coaches.filter(c=>!used.has(c.id)); packs[9].ids[4]=ac[Math.floor(rnd()*ac.length)].id; }
  return packs;
}

// ===== IA do rival: vê só a própria mão, a categoria e as cartas já reveladas. Nunca a sua mão nem a sua carta virada =====
let PRIOR=null, PRIOR_LEAD=null;
function buildPrior(copas){
  PRIOR={}; PRIOR_LEAD={};
  const pool=Object.values(C).filter(c=>c.pos!=="TEC"&&copas.includes(c.copa));
  CATS.forEach(([k])=>{
    PRIOR[k]=pool.filter(c=>c.ov>=78).map(c=>c[k]+2).sort((a,b)=>a-b);
    const s=pool.map(c=>c[k]+2).sort((a,b)=>a-b); PRIOR_LEAD[k]=s.slice(Math.floor(s.length*0.7)); // quem puxa a categoria costuma ter carta forte nela
  });
}
function cdf(arr,v){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<v) lo=m+1; else hi=m;} let eq=lo; while(eq<arr.length&&arr[eq]===v) eq++; return (lo+(eq-lo)/2)/arr.length; }
const F=(v,cat)=>cdf(PRIOR[cat],v);
const bv=(id,cat)=>C[id][cat]+BOT_CHEM;
const useful=id=>Math.max(...CATS.map(([k])=>F(bv(id,k),k)));
function botLead(hand,k,info){
  const kk=Math.min(k,3), opts=[];
  hand.forEach(id=>CATS.forEach(([cat])=>{ const p=Math.pow(F(bv(id,cat),cat),kk), pb=info.coachAvail?Math.pow(F(bv(id,cat)+info.boost,cat),kk):0; opts.push({id,cat,p,pb}); }));
  opts.sort((a,b)=>b.p-a.p);
  const best=opts[Math.floor(rnd()*Math.min(2,opts.length))];
  if(best.p>=0.3||hand.length===1) return {id:best.id,cat:best.cat,boost:info.coachAvail&&best.pb-best.p>0.12&&rnd()<0.7};
  const withB=opts.filter(o=>o.pb>=0.35).sort((a,b)=>b.pb-a.pb)[0];
  if(withB&&rnd()<0.6) return {id:withB.id,cat:withB.cat,boost:true};
  const junk=hand.slice().sort((a,b)=>useful(a)-useful(b))[0];
  const jc=CATS.map(([c])=>c).sort((a,b)=>F(bv(junk,b),b)-F(bv(junk,a),a))[0];
  return {id:junk,cat:jc,boost:false};
}
function botRespond(hand,cat,info){
  const P=(id,b=0)=>cdf(PRIOR_LEAD[cat],bv(id,cat)+b);
  const byUse=hand.slice().sort((a,b)=>useful(a)-useful(b));
  const t=0.55+rnd()*0.1;
  const ok=byUse.filter(id=>P(id)>=t); if(ok.length) return {id:ok[0],boost:false};
  if(info.coachAvail){ const ob=byUse.filter(id=>P(id,info.boost)>=t); if(ob.length&&rnd()<0.8) return {id:ob[0],boost:true}; }
  if(rnd()<0.3){ const top=hand.slice().sort((a,b)=>P(b)-P(a))[0]; return {id:top,boost:false}; }
  return {id:byUse[0],boost:false};
}

// ===== Copa =====
const MD=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const STAGE_NAME=["Grupos, rodada 1","Grupos, rodada 2","Grupos, rodada 3","Oitavas de final","Quartas de final","Semifinal","Final"];
const GL="ABCDEFGH";
function teamStr(t){ const ov=t.ids.reduce((s,id)=>s+C[id].ov+(t.chem?t.chem[id]||0:BOT_CHEM),0)/t.ids.length; return ov+(t.coach?(C[t.coach].ov-75)*0.08:0); }
function startCup(){
  const ids=S.slots.map(s=>s.id), ch=chemistry(ids,S.coach), chem={}; ids.forEach(id=>chem[id]=ch[id].b);
  const keys=shuffle(Object.keys(TEAMS).filter(k=>S.copas.includes(TEAMS[k].copa)&&TEAMS[k].ids.length>=11)).slice(0,31);
  S.teams=[{name:"Seu time",human:true,ids,coach:S.coach,chem}].concat(keys.map(k=>({name:TEAMS[k].sel+" "+TEAMS[k].copa,sel:TEAMS[k].sel,ids:TEAMS[k].ids.slice(0,11),coach:TEAMS[k].coach})));
  S.teams.forEach(t=>t.str=teamStr(t));
  const rest=shuffle(S.teams.map((_,i)=>i).slice(1));
  S.groups=[[0,...rest.slice(0,3)]]; for(let g=1;g<8;g++) S.groups.push(rest.slice(3+(g-1)*4,3+g*4));
  S.stage=0; S.results=[]; S.ko={}; S.out=false; S.champion=null; S.exit=null;
  S.screen="table"; save(); render();
}
function simMatch(a,b,ko){
  const d=S.teams[a].str-S.teams[b].str;
  const r={stage:S.stage,a,b,ga:poisson(1.3*Math.exp(d/9)),gb:poisson(1.3*Math.exp(-d/9))};
  if(ko&&r.ga===r.gb) r.pw=rnd()<1/(1+Math.exp(-d/5))?a:b;
  return r;
}
const winnerOf=r=>r.ga>r.gb?r.a:r.gb>r.ga?r.b:r.pw;
function standings(g){
  const rows=S.groups[g].map(t=>({t,j:0,gp:0,gc:0,pts:0})), byT={}; rows.forEach(r=>byT[r.t]=r);
  S.results.filter(r=>r.stage<3&&byT[r.a]&&byT[r.b]).forEach(r=>{
    const A=byT[r.a],B=byT[r.b]; A.j++;B.j++; A.gp+=r.ga;A.gc+=r.gb;B.gp+=r.gb;B.gc+=r.ga;
    if(r.ga>r.gb)A.pts+=3; else if(r.gb>r.ga)B.pts+=3; else {A.pts++;B.pts++;}
  });
  return rows.sort((x,y)=>y.pts-x.pts||(y.gp-y.gc)-(x.gp-x.gc)||y.gp-x.gp||S.teams[y.t].str-S.teams[x.t].str);
}
function userOpp(){
  if(S.out) return null;
  if(S.stage<3) return S.groups[0][MD[S.stage][0][1]];
  const pr=(S.ko[S.stage]||[]).find(p=>p.includes(0)); return pr?(pr[0]===0?pr[1]:pr[0]):null;
}
function finishStage(){
  const st=S.stage;
  if(st<3){
    S.groups.forEach(g=>MD[st].forEach(([i,j])=>{ if(g[i]===0||g[j]===0) return; S.results.push(simMatch(g[i],g[j],false)); }));
    if(st===2){
      const T=S.groups.map((_,g)=>standings(g)), q=g=>[T[g][0].t,T[g][1].t];
      S.ko[3]=[[q(0)[0],q(1)[1]],[q(2)[0],q(3)[1]],[q(4)[0],q(5)[1]],[q(6)[0],q(7)[1]],[q(1)[0],q(0)[1]],[q(3)[0],q(2)[1]],[q(5)[0],q(4)[1]],[q(7)[0],q(6)[1]]];
      if(!S.ko[3].flat().includes(0)){ S.out=true; S.exit="fase de grupos, "+(T[0].findIndex(r=>r.t===0)+1)+"º do Grupo A"; }
    }
  } else {
    S.ko[st].forEach(([a,b])=>{ if(!S.out&&(a===0||b===0)) return; S.results.push(simMatch(a,b,true)); });
    const res=S.ko[st].map(([a,b])=>winnerOf(S.results.find(r=>r.stage===st&&r.a===a&&r.b===b)));
    if(!S.out&&!res.includes(0)){ S.out=true; S.exit=STAGE_NAME[st].toLowerCase(); }
    if(st===6) S.champion=res[0]; else { S.ko[st+1]=[]; for(let i=0;i<res.length;i+=2) S.ko[st+1].push([res[i],res[i+1]]); }
  }
  S.stage++;
}
function advance(){ finishStage(); while(S.out&&S.champion==null) finishStage(); S.screen=S.champion!=null?"end":"table"; save(); render(); }


// ===== Partida =====
const COACH_USES=3;
const myVal=(id,cat)=>C[id][cat]+(S.teams[0].chem[id]||0);
function botInfo(){ const m=S.match,t=S.teams[m.opp]; return {coachAvail:!!t.coach&&m.botCL>0,boost:t.coach?boost(C[t.coach]):0}; }
function startMatch(){
  const opp=userOpp();
  S.match={opp,ko:S.stage>=3,my:S.teams[0].ids.slice(),bot:S.teams[opp].ids.slice(),myCL:COACH_USES,botCL:S.teams[opp].coach?COACH_USES:0,gm:0,gb:0,round:1,
    mando:rnd()<0.5?"me":"bot",phase:"lead",cat:null,sel:null,useCoach:false,lead:null,resp:null,last:null,revealed:[]};
  newRound(); S.screen="match"; save(); render();
}
function newRound(){
  const m=S.match; m.cat=null; m.sel=null; m.useCoach=false; m.lead=null; m.resp=null; m.last=null; m.reveal=false;
  if(m.mando==="bot"){ const L=botLead(m.bot,m.my.length,botInfo()); m.lead={side:"bot",id:L.id,boost:L.boost}; m.cat=L.cat; m.phase="respond"; }
  else m.phase="lead";
}
function act(){
  const m=S.match; if(!m.sel||!m.cat) return;
  if(m.phase==="lead"){ m.lead={side:"me",id:m.sel,boost:m.useCoach}; const R=botRespond(m.bot,m.cat,botInfo()); m.resp={side:"bot",id:R.id,boost:R.boost}; }
  else m.resp={side:"me",id:m.sel,boost:m.useCoach};
  const mine=m.lead.side==="me"?m.lead:m.resp, theirs=m.lead.side==="bot"?m.lead:m.resp, cat=m.cat;
  const bm=mine.boost?boost(C[S.teams[0].coach]):0, bb=theirs.boost?botInfo().boost:0;
  const va=myVal(mine.id,cat)+bm, vb=bv(theirs.id,cat)+bb, w=va>vb?"me":vb>va?"bot":"tie";
  if(w==="me") m.gm++; if(w==="bot") m.gb++; if(bm) m.myCL--; if(bb) m.botCL--;
  m.my=m.my.filter(id=>id!==mine.id); m.bot=m.bot.filter(id=>id!==theirs.id); m.revealed.push(theirs.id);
  m.last={mine:mine.id,theirs:theirs.id,va,vb,bm,bb,cat,w,iLed:m.lead.side==="me"};
  if(w!=="tie") m.mando=w;
  m.phase="result"; m.reveal=false; save(); render();
  setTimeout(()=>{ if(S&&S.match===m&&m.phase==="result"){ m.reveal=true; save(); render(); } }, m.last.iLed?1300:700);
}
function nextRound(){ const m=S.match; if(!m.my.length) return endMatch(); m.round++; newRound(); save(); render(); }
function penalties(myIds,botIds){
  const kick=(sh,gk)=>rnd()<Math.min(0.9,Math.max(0.5,0.72+(sh.at-gk.de)/120));
  const gkOf=ids=>ids.map(id=>C[id]).sort((x,y)=>(y.pos==="GOL")-(x.pos==="GOL")||y.de-x.de)[0];
  const sh=ids=>ids.map(id=>C[id]).filter(c=>c.pos!=="GOL").sort((x,y)=>y.at-x.at);
  const A=sh(myIds),B=sh(botIds),ga=gkOf(myIds),gb=gkOf(botIds),me=[],bot=[],tot=a=>a.filter(Boolean).length;
  for(let i=0;i<5;i++){ me.push(kick(A[i],gb)); if(tot(me)>tot(bot)+(5-i)||tot(bot)>tot(me)+(4-i)) break; bot.push(kick(B[i],ga)); if(tot(bot)>tot(me)+(4-i)||tot(me)>tot(bot)+(4-i)) break; }
  let i=5; while(tot(me)===tot(bot)&&i<20){ me.push(kick(A[i%A.length],gb)); bot.push(kick(B[i%B.length],ga)); i++; }
  return {me,bot,win:tot(me)>tot(bot)};
}
function endMatch(){
  const m=S.match; const r={stage:S.stage,a:0,b:m.opp,ga:m.gm,gb:m.gb};
  if(m.ko&&m.gm===m.gb){ const p=penalties(S.teams[0].ids,S.teams[m.opp].ids); r.pw=p.win?0:m.opp; m.pens=p; }
  if(S.stage>=3){ const pr=S.ko[S.stage].find(p=>p.includes(0)); if(pr[0]!==0){ r.a=pr[0]; r.b=0; r.ga=m.gb; r.gb=m.gm; } }
  S.results.push(r); S.screen="post"; save(); render();
}

// campo: posições fixas por linha, linhas de química entre colegas da mesma seleção
const ROW_Y={ATA:11,MEI:32,VOL:52,D:72,GOL:90};
function pitchPos(slots){
  const idx={}; slots.forEach((s,i)=>(idx[s.pos]=idx[s.pos]||[]).push(i));
  const lat=idx.LAT||[], def=[lat[0],...(idx.ZAG||[]),lat[1]].filter(x=>x!=null);
  const rows=[["ATA",idx.ATA||[]],["MEI",idx.MEI||[]],["VOL",idx.VOL||[]],["D",def],["GOL",idx.GOL||[]]];
  const pos={}; rows.forEach(([r,list])=>list.forEach((i,k)=>pos[i]={x:(k+1)/(list.length+1)*100,y:ROW_Y[r]}));
  return pos;
}
function pitch(o){
  const P=pitchPos(S.slots), ids=S.slots.map(s=>s.id), links=[];
  // liga cada grupo da mesma seleção pelo caminho mais curto (árvore mínima), para o campo não virar teia
  const groups={}; ids.forEach((id,i)=>{ if(id) (groups[C[id].sel]=groups[C[id].sel]||[]).push(i); });
  const d=(i,j)=>Math.hypot(P[i].x-P[j].x,(P[i].y-P[j].y)*1.25);
  Object.values(groups).filter(g=>g.length>1).forEach(g=>{ const inT=[g[0]]; const rest=g.slice(1);
    while(rest.length){ let bi=0,bj=0,bd=1e9; inT.forEach(i=>rest.forEach((j,k)=>{ if(d(i,j)<bd){bd=d(i,j);bi=i;bj=k;} }));
      const j=rest.splice(bj,1)[0]; inT.push(j); const A=C[ids[bi]],B=C[ids[j]]; links.push([bi,j,LINE[A.pos]===LINE[B.pos]||A.copa===B.copa]); } });
  const svg=`<svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none">${links.map(([i,j,s])=>`<line x1="${P[i].x}" y1="${P[i].y}" x2="${P[j].x}" y2="${P[j].y}" class="${s?"strong":""}${o.dim?" dim":""}"/>`).join("")}</svg>`;
  const tiles=S.slots.map((s,i)=>{
    const c=s.id&&C[s.id], ch=o.chem&&c?o.chem[c.id]||0:0;
    const st=`left:${P[i].x}%;top:${P[i].y}%`;
    if(!c) return `<button class="slot empty${o.open===i?" open":""}" style="${st}" onclick="openSlot(${i})"><b>+</b><span>${s.pos}</span></button>`;
    const used=o.used&&o.used.has(c.id), sel=o.sel===c.id, val=o.cat?C[c.id][o.cat]+ch:c.ov+ch;
    const click=o.mode==="match"?(used?"":`selCard('${c.id}')`):o.mode==="sim"?"":`openSlot(${i})`;
    const fl=o.flash&&o.flash[i]?`<em class="float${once("fl"+S.flashN+"_"+i)}">+${o.flash[i]}</em>`:"";
    return `<button class="slot r-${rar(c)}${used?" used":""}${sel?" sel":""}${o.open===i?" open":""}" style="${st}" onclick="${click}" ${used?"disabled":""}>
      <div class="sflag" style="${flag(c.sel)}"></div><b>${val}</b>${o.mode==="select"&&ch?`<i class="cb">+${ch}</i>`:""}<span>${esc(lastName(c.nome))}</span>${o.goals&&o.goals[c.id]?`<i class="ball">${"⚽".repeat(o.goals[c.id])}</i>`:""}${o.cat?`<small>${CAT_NAME[o.cat].slice(0,3)}</small>`:""}${fl}</button>`;
  }).join("");
  return `<div class="pitch"><div class="lines"></div>${svg}${tiles}</div>`;
}
function chemPanel(ids,coach,ch){
  const groups={}; ids.filter(Boolean).forEach(id=>(groups[C[id].sel]=groups[C[id].sel]||[]).push(id));
  const rows=Object.entries(groups).filter(([,l])=>l.length>1).sort((a,b)=>b[1].length-a[1].length).map(([sel,l])=>{
    const sum=l.reduce((s,id)=>s+ch[id].b,0);
    return `<li><i class="sw" style="${flag(sel)}"></i><div><b>${esc(sel)} ×${l.length}</b><span>${l.map(id=>esc(lastName(C[id].nome))).join(", ")}</span></div><em>+${sum}</em></li>`; });
  const sts=ids.filter(id=>id&&isST(C[id]));
  if(sts.length>1) rows.push(`<li><i class="sw st"></i><div><b>Super Trunfos ×${sts.length}</b><span>${sts.map(id=>esc(lastName(C[id].nome))).join(", ")}</span></div><em>+${sts.length*Math.min(sts.length-1,2)}</em></li>`);
  if(coach){ const n=ids.filter(id=>id&&C[id].sel===C[coach].sel).length; rows.push(`<li><i class="sw" style="${flag(C[coach].sel)}"></i><div><b>Técnico ${esc(lastName(C[coach].nome))}</b><span>${n?`+1 para ${n} jogador${n>1?"es":""} de ${esc(C[coach].sel)}`:`Nenhum jogador de ${esc(C[coach].sel)}`}</span></div><em>${n?"+"+n:"0"}</em></li>`); }
  return `<ul class="combos">${rows.join("")||`<li class="none">Nenhuma combinação ainda. Junte jogadores da mesma seleção para ligar as linhas no campo.</li>`}</ul>`;
}

  const ids=S.slots.map(s=>s.id), ch=chemistry(ids,S.coach), full=ids.every(Boolean)&&S.coach;

  const m=S.match, op=S.teams[m.opp];
  const res=m.gm>m.gb?"Vitória":m.gm<m.gb?"Derrota":m.pens?(m.pens.win?"Classificado nos pênaltis":"Eliminado nos pênaltis"):"Empate";
  const pen=m.pens?`<div class="pens"><div><span>Você</span>${m.pens.me.map(x=>`<i class="${x?"g":"x"}"></i>`).join("")}</div><div><span>${esc(op.name)}</span>${m.pens.bot.map(x=>`<i class="${x?"g":"x"}"></i>`).join("")}</div></div>`:"";
  return `<div class="page center">${tools()}<section class="next"><p>${STAGE_NAME[S.stage]}</p><h2>${res}</h2><div class="final">Seu time <b>${m.gm} × ${m.gb}</b> ${esc(op.name)}</div>${m.sim&&m.et?`<p class="sub">Com prorrogação</p>`:""}${pen}
  ${m.sim?`<ul class="feed post">${m.ev.filter(e=>e.t==="gol").reverse().map(e=>`<li class="s-${e.side}"><em>${e.min}'</em><span>${e.txt}</span></li>`).join("")||"<li><span>Sem gols</span></li>"}</ul>`:""}
  <button class="btn primary" onclick="advance()">Continuar</button></section></div>`;
}
function vEnd(){
  const won=S.champion===0, fin=S.results.find(r=>r.stage===6);
  return `<div class="page center">${tools()}<section class="next end"><p>Copa encerrada</p><h2>${won?"Seu time é campeão!":"Campeão: "+esc(S.teams[S.champion].name)}</h2>
  ${won?"":`<p class="sub">Você caiu na ${esc(S.exit)}.</p>`}${fin?`<ul class="res">${resLine(fin)}</ul>`:""}
  <button class="btn primary" onclick="newCup()">Nova Copa</button></section></div>`;
}

// ===== Ações =====
let RULES=false;
function render(){
  const v=!S?vHome():({rules:vRules,packs:vPacks,select:vSelect,table:vTable,match:vMatch,sim:vSim,post:vPost,end:vEnd})[S.screen]();
  document.getElementById("app").innerHTML=v+(RULES?`<div class="modal" onclick="if(event.target===this)showRules(false)"><div class="mbox"><header class="bar"><b>Regras</b><button class="chip" onclick="showRules(false)">Fechar</button></header>${rulesHTML()}</div></div>`:"");
}
const top0=()=>scrollTo(0,0);
function showRules(v){ RULES=v; render(); }
function setMode(k){ SETUP.mode=k; render(); }
function setForm(k){ SETUP.form=k; render(); }
function togY(y){ SETUP.copas=SETUP.copas.includes(y)?SETUP.copas.filter(x=>x!==y):[...SETUP.copas,y].sort(); render(); }
function newGame(){ goFS(); S={screen:"rules",mode:SETUP.mode,copas:SETUP.copas.slice(),form:SETUP.form,packs:genPacks(SETUP.copas,SETUP.form),opened:0,star:[]}; buildPrior(S.copas); save(); render(); top0(); }
function rulesOk(){ S.screen="packs"; save(); render(); top0(); }
function resume(){ goFS(); S=loadSave(); buildPrior(S.copas); if(S.match){ S.match.reveal=true; if(S.match.phase==="live") S.match.phase="paused"; } render(); }
function newCup(){ clearSave(); S=null; render(); top0(); }
function openPack(){ if(S.opened<10){S.opened++; save(); render(); top0();} }
function openAll(){ S.opened=10; toSelect(); }
function star(id){ S.star=S.star.includes(id)?S.star.filter(x=>x!==id):[...S.star,id]; save(); render(); }
function toSelect(){
  const f=FORMATIONS[S.form]; S.slots=[]; ["GOL","ZAG","LAT","VOL","MEI","ATA"].forEach(p=>{for(let i=0;i<f[p];i++) S.slots.push({pos:p,id:null});});
  S.coach=null; S.open=null; S.flash=null; S.flashN=0; S.flashTot=0;
  S.star.forEach(id=>{ const c=C[id]; if(c.pos==="TEC"){ if(!S.coach) S.coach=id; } else { const s=S.slots.find(s=>s.pos===c.pos&&!s.id); if(s) s.id=id; } });
  S.screen="select"; save(); render(); top0();
}
function openSlot(i){ S.open=S.open===i?null:i; S.flash=null; S.flashTot=0; render(); }
function closeSlot(){ S.open=null; render(); }
function chemBySlot(){ const ids=S.slots.map(s=>s.id), ch=chemistry(ids,S.coach); return [ids.map(id=>id?ch[id].b:0), chemTotal(ch)]; }
function place(id){
  const [b0,t0]=chemBySlot();
  if(S.open==="TEC") S.coach=id; else { const i=S.open; S.slots[i].id=id; b0[i]=0; }
  const [b1,t1]=chemBySlot(); S.flash={}; b1.forEach((v,i)=>{ if(v>b0[i]) S.flash[i]=v-b0[i]; }); S.flashN++; S.flashTot=t1-t0;
  S.open=null; save(); render();
}
function clearSlot(){ if(S.open==="TEC") S.coach=null; else S.slots[S.open].id=null; S.flash=null; S.flashTot=0; save(); render(); }
function setCat(k){ S.match.cat=k; render(); }
function selCard(id){ if(S.match.phase!=="result"){ S.match.sel=id; render(); } }
function togCoach(){ S.match.useCoach=!S.match.useCoach; render(); }

// ===== Modo Simulação: 90 minutos ao vivo =====
const STYLES=["Equilibrado","Posse de bola","Pressão alta","Contra-ataque"];
const STYLE_HINT={"Equilibrado":"Sem vantagem nem fraqueza.","Posse de bola":"Mais meio-campo. Vence Contra-ataque.","Pressão alta":"Mais ataque, defesa exposta. Vence Posse de bola.","Contra-ataque":"Defesa forte. Vence Pressão alta."};
const STYLE_MOD={"Equilibrado":[1,1,1],"Posse de bola":[1,1.04,1],"Pressão alta":[1.03,1,0.98],"Contra-ataque":[0.98,0.98,1.05]};
const BEATS={"Pressão alta":"Posse de bola","Posse de bola":"Contra-ataque","Contra-ataque":"Pressão alta"};
const FORM_MOD={"4-3-3":[1.03,1,0.99],"4-4-2":[1,1.01,1.01],"4-2-3-1":[1.01,1.02,1],"3-5-2":[1,1.03,0.99],"5-3-2":[0.97,0.99,1.05]};
const W_AT={ATA:1,MEI:0.7,LAT:0.3,VOL:0.25}, W_MD={VOL:1,MEI:1,LAT:0.3,ATA:0.3}, W_DF={ZAG:1,LAT:0.8,VOL:0.6,GOL:1.8};
const SIM_BOT_CHEM=2;
const SPEEDS=[[1,600],[2,280],[4,110]];
function formationOf(ids){ const c={}; ids.forEach(id=>c[C[id].pos]=(c[C[id].pos]||0)+1); for(const [k,v] of Object.entries(FORMATIONS)) if(Object.keys(v).every(p=>(c[p]||0)===v[p])) return k; return "4-4-2"; }
function teamRatings(t,style,isMe){
  const ps=t.ids.map(id=>C[id]), ch=id=>isMe?(t.chem[id]||0):SIM_BOT_CHEM;
  const wavg=(W,k)=>{ let s=0,w=0; ps.forEach(p=>{const x=W[p.pos]||0; s+=x*(p[k]+ch(p.id)); w+=x;}); return w?s/w:60; };
  const f=FORM_MOD[isMe?S.form:formationOf(t.ids)]||[1,1,1], s=STYLE_MOD[style]||[1,1,1], c=1+((t.coach?C[t.coach].ov:70)-75)*0.003;
  return {at:wavg(W_AT,"at")*f[0]*s[0]*c, md:wavg(W_MD,"cr")*f[1]*s[1]*c, df:wavg(W_DF,"de")*f[2]*s[2]*c};
}
function botStyle(t){ const r=teamRatings(t,"Equilibrado",false), g=(r.at+r.md+r.df)/3, h=[...t.name].reduce((a,c)=>a+c.charCodeAt(0),0);
  return g>82?(h%2?"Posse de bola":"Pressão alta"):g<74?"Contra-ataque":STYLES[h%4]; }
function goPre(){
  const opp=userOpp(), op=S.teams[opp];
  S.match={sim:true,opp,ko:S.stage>=3,style:S.lastStyle||"Equilibrado",oppStyle:botStyle(op),min:0,gm:0,gb:0,ev:[],shA:0,shB:0,onA:0,onB:0,poss:0,
    myCL:COACH_USES,botCL:op.coach?COACH_USES:0,boostA:0,boostB:0,luckA:Math.exp(gauss()*0.12),luckB:Math.exp(gauss()*0.12),phase:"pre",speed:0,running:false,flash:null,goals:{},my:[]};
  S.screen="sim"; save(); render();
}
function gauss(){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function lambdas(m){
  const me=S.teams[0], op=S.teams[m.opp], A=teamRatings(me,m.style,true), B=teamRatings(op,m.oppStyle,false);
  let la=1.3*Math.pow((0.65*A.at+0.35*A.md)/(0.65*B.df+0.35*B.md),3)*m.luckA, lb=1.3*Math.pow((0.65*B.at+0.35*B.md)/(0.65*A.df+0.35*A.md),3)*m.luckB;
  if(BEATS[m.style]===m.oppStyle){la*=1.08;lb*=0.95;} else if(BEATS[m.oppStyle]===m.style){lb*=1.08;la*=0.95;}
  if(m.boostA>m.min){la*=1.25;lb*=0.92;} if(m.boostB>m.min){lb*=1.25;la*=0.92;}
  const pa=A.md*A.md/(A.md*A.md+B.md*B.md)+(m.style==="Posse de bola"?0.05:m.style==="Contra-ataque"?-0.05:0)-(m.oppStyle==="Posse de bola"?0.05:m.oppStyle==="Contra-ataque"?-0.05:0);
  return {la:Math.min(Math.max(la,0.15),5), lb:Math.min(Math.max(lb,0.15),5), pa:Math.min(Math.max(pa,0.25),0.75), A, B};
}
function wpickP(ps,f){ const w=ps.map(f), t=w.reduce((a,b)=>a+b,0); let r=rnd()*t; for(let i=0;i<ps.length;i++){ r-=w[i]; if(r<=0) return ps[i]; } return ps[ps.length-1]; }
const scorerOf=t=>wpickP(t.ids.map(id=>C[id]).filter(p=>p.pos!=="GOL"),p=>Math.pow(Math.max(p.at,20)/60,4)*({ATA:3,MEI:1.6,LAT:0.5,VOL:0.6,ZAG:0.35})[p.pos]);
const assistOf=(t,sc)=>wpickP(t.ids.map(id=>C[id]).filter(p=>p.pos!=="GOL"&&p!==sc),p=>Math.pow(Math.max(p.cr,20)/60,4)*({ATA:1.2,MEI:2.5,LAT:1,VOL:0.8,ZAG:0.2})[p.pos]);
const keeperOf=t=>t.ids.map(id=>C[id]).find(p=>p.pos==="GOL")||C[t.ids[0]];
function simMinute(){
  const m=S.match, me=S.teams[0], op=S.teams[m.opp]; m.min++;
  const {la,lb,pa}=lambdas(m); m.poss+=pa;
  const shotsOf=l=>Math.min(Math.max(9+6*(l/1.3-1),4,),22);
  [[la,"A",me,op],[lb,"B",op,me]].forEach(([l,side,T,O])=>{
    const sh=shotsOf(l); if(rnd()>=sh/90) return;
    const sc=scorerOf(T), gk=keeperOf(O); side==="A"?m.shA++:m.shB++;
    if(rnd()<l/sh){ side==="A"?(m.gm++,m.onA++):(m.gb++,m.onB++); const as=rnd()<0.7?assistOf(T,sc):null;
      if(side==="A") m.goals[sc.id]=(m.goals[sc.id]||0)+1;
      m.ev.unshift({min:m.min,side,t:"gol",txt:`<b>GOL!</b> ${esc(sc.nome)}${as?` <small>(assist. ${esc(as.nome)})</small>`:""}`});
      m.flash={side,nome:sc.nome,k:m.min+side+m.gm+m.gb}; }
    else { const r=rnd(); if(r<0.4){ side==="A"?m.onA++:m.onB++; m.ev.unshift({min:m.min,side,t:"def",txt:`${esc(sc.nome)} finaliza, ${esc(gk.nome)} defende`}); }
      else if(r<0.47) m.ev.unshift({min:m.min,side,t:"trave",txt:`Na trave! ${esc(sc.nome)} quase marca`});
      else if(r<0.75) m.ev.unshift({min:m.min,side,t:"fora",txt:`${esc(sc.nome)} chuta para fora`}); }
  });
  // técnico rival reage
  if(m.botCL>0&&m.boostB<=m.min&&((m.min===60&&m.gb<=m.gm)||(m.min===78&&m.gb<m.gm)||(m.min===100&&m.gb<=m.gm))){ m.botCL--; m.boostB=m.min+10; m.ev.unshift({min:m.min,side:"B",t:"tec",txt:`${esc(C[op.coach].nome)} chama o time para a preleção`}); }
  if(m.ev.length>40) m.ev.length=40;
  if(m.min===45){ m.phase="ht"; m.ev.unshift({min:45,t:"apito",txt:"Fim do primeiro tempo"}); }
  else if(m.min===90){ if(m.ko&&m.gm===m.gb){ m.phase="etb"; m.ev.unshift({min:90,t:"apito",txt:"Empate: vai para a prorrogação"}); } else { m.phase="end"; m.ev.unshift({min:90,t:"apito",txt:"Fim de jogo"}); } }
  else if(m.min===105&&m.ko) { m.phase="etht"; }
  else if(m.min===120){ m.phase="end"; m.ev.unshift({min:120,t:"apito",txt:m.gm===m.gb?"Fim da prorrogação: pênaltis":"Fim da prorrogação"}); }
}
let CLOCK=null;
function stopClock(){ if(CLOCK){clearInterval(CLOCK);CLOCK=null;} }
function startClock(){
  stopClock(); const m=S.match;
  CLOCK=setInterval(()=>{ if(!S||!S.match||S.match!==m||m.phase!=="live"){stopClock();return;} simMinute(); if(m.phase!=="live") stopClock(); save(); render(); }, SPEEDS[m.speed][1]);
}
function kickoff(){ const m=S.match; S.lastStyle=m.style; m.phase="live"; m.ev.unshift({min:m.min,t:"apito",txt:m.min===0?"Bola rolando!":m.min===45?"Começa o segundo tempo":m.min===90?"Começa a prorrogação":"Segundo tempo da prorrogação"}); save(); render(); startClock(); }
function togglePause(){ const m=S.match; if(m.phase==="live"){ m.phase="paused"; stopClock(); } else if(m.phase==="paused"){ m.phase="live"; startClock(); } save(); render(); }
function setSpeed(i){ S.match.speed=i; if(S.match.phase==="live") startClock(); render(); }
function setStyle(s){ S.match.style=s; if(S.match.min===0) S.lastStyle=s; save(); render(); }
function callCoach(){ const m=S.match; if(m.myCL<=0||m.boostA>m.min) return; m.myCL--; m.boostA=m.min+10; m.ev.unshift({min:m.min,side:"A",t:"tec",txt:`Preleção de ${esc(C[S.teams[0].coach].nome)}: time ligado até ${m.min+10}'`}); save(); render(); }
function skipToBreak(){ const m=S.match; stopClock(); if(m.phase==="paused") m.phase="live"; while(m.phase==="live") simMinute(); save(); render(); }
function finishSim(){ stopClock(); const m=S.match; m.et=m.min>90; endMatch(); }
function bars(l,a,b,fmt){ const t=a+b||1; return `<div class="sbar"><span>${fmt?fmt(a):a}</span><div><i style="width:${a/t*100}%"></i></div><em>${l}</em><div class="r"><i style="width:${b/t*100}%"></i></div><span>${fmt?fmt(b):b}</span></div>`; }
function vSim(){
  const m=S.match, op=S.teams[m.opp], me=S.teams[0], L=lambdas(m);
  const clock=m.min<=90?`${m.min}'`:`${m.min}' <small>prorr.</small>`;
  const score=`<header class="score"><span>Seu time</span><b>${m.gm}<i>×</i>${m.gb}</b><span>${esc(op.name)}</span>
   <div class="clockrow"><span class="clock${m.phase==="live"?" run":""}">${m.phase==="pre"?"Pré-jogo":clock}</span><div class="prog"><i style="width:${Math.min(m.min,m.ko&&m.min>90?120:90)/(m.min>90?120:90)*100}%"></i></div></div></header>`;
  const flash=m.flash&&m.phase!=="pre"?`<div class="goalfx v-${m.flash.side==="A"?"me":"bot"}${once("g"+m.flash.k)}"><b>GOOOL!</b><span>${esc(m.flash.nome)}</span></div>`:"";
  const styles=`<div class="styles">${STYLES.map(s=>`<button class="chip${m.style===s?" on":""}" onclick="setStyle('${s}')">${s}</button>`).join("")}</div>
    <p class="hint">${STYLE_HINT[m.style]} ${BEATS[m.style]===m.oppStyle?"<b class='up'>Leva vantagem sobre o estilo rival.</b>":BEATS[m.oppStyle]===m.style?"<b class='down'>O estilo rival leva vantagem.</b>":""}</p>`;
  let mid="", dock="";
  if(m.phase==="pre"){
    const cmp=(l,a,b)=>`<div class="cmp"><span>${a.toFixed(1)}</span><em>${l}</em><span>${b.toFixed(1)}</span></div>`;
    mid=`<div class="prebox"><h3>Seu time × ${esc(op.name)}</h3>${cmp("Ataque",L.A.at,L.B.at)}${cmp("Meio",L.A.md,L.B.md)}${cmp("Defesa",L.A.df,L.B.df)}
      <p class="hint">${esc(op.name)} joga no ${formationOf(op.ids)} com <b>${m.oppStyle}</b>${op.coach?`, técnico ${esc(C[op.coach].nome)}`:""}. Química e entrosamento já estão somados.</p>
      <h3>Seu estilo</h3>${styles}</div>`;
    dock=`<button class="btn primary" onclick="kickoff()">Apito inicial</button>`;
  } else {
    const pm=m.min?Math.round(m.poss/m.min*100):50;
    const feed=`<ul class="feed">${m.ev.map((e,i)=>`<li class="e-${e.t} s-${e.side||"n"}${i<3?once("ev"+m.opp+"_"+S.stage+"_"+e.min+e.t+(e.side||"")+i).replace("enter","new"):""}"><em>${e.min}'</em><span>${e.txt}</span></li>`).join("")}</ul>`;
    mid=`<div class="stats2">${bars("Posse",pm,100-pm,x=>x+"%")}${bars("Finalizações",m.shA,m.shB)}${bars("No gol",m.onA,m.onB)}</div>${feed}`;
    const coachBtn=m.myCL>0?`<button class="toggle${m.boostA>m.min?" on":""}" onclick="callCoach()" ${m.boostA>m.min||m.phase==="end"?"disabled":""}>${m.boostA>m.min?`Preleção até ${m.boostA}'`:"Preleção"}<small>${m.myCL} de ${COACH_USES}</small></button>`:`<span class="cu">Preleções usadas</span>`;
    if(m.phase==="live"||m.phase==="paused") dock=`<details class="tact"><summary>Tática: ${m.style}</summary>${styles}</details>
      <div class="drow">${coachBtn}<div class="speed">${SPEEDS.map(([x],i)=>`<button class="chip${m.speed===i?" on":""}" onclick="setSpeed(${i})">${x}x</button>`).join("")}</div>
      <button class="btn primary" onclick="togglePause()">${m.phase==="live"?"Pausar":"Continuar"}</button></div>
      <button class="link" onclick="skipToBreak()">Pular para o ${m.min<45?"intervalo":m.min<90?"fim":"fim da prorrogação"}</button>`;
    else if(m.phase==="ht"||m.phase==="etb"||m.phase==="etht") dock=`<p class="turn"><b>${m.phase==="ht"?"Intervalo":m.phase==="etb"?"Prorrogação":"Intervalo da prorrogação"}.</b> Ajuste a tática.</p>${styles}<div class="drow">${coachBtn}<button class="btn primary" onclick="kickoff()">${m.phase==="ht"?"Começar 2º tempo":"Rolar a bola"}</button></div>`;
    else dock=`<button class="btn primary" onclick="finishSim()">${m.ko&&m.gm===m.gb?"Ir para os pênaltis":"Ver resultado"}</button>`;
  }
  return `<div class="match sim">${tools()}
   <div class="mleft">${pitch({mode:"sim",chem:me.chem,goals:m.goals,dim:true})}</div>
   <div class="mright">${score}<div class="arena simarena">${mid}</div><div class="dock">${dock}</div></div>${flash}</div>`;
}

render();
